# Everything marked (dashboard) can also be changed live at http://127.0.0.1:8080
scanner:
  # Pages reloaded continuously; every product card on them is checked for SuperCoin offers.
  # Use `python -m fksc discover` to find where Flipkart shows coin-back deals, then add those pages.
  sources:
    - https://www.flipkart.com/
  # Individual product pages to keep checking
  watchlist: []
  min_ratio: 0.5          # (dashboard) 0.5 = 50% coin back, 1.0 = 100%
  auto_buy: false         # (dashboard) false = alert only
  interval_s: 4           # (dashboard) per page; lower = faster detection but higher block risk
  settle_ms: 800          # wait after load for prices/offers to render
  scroll_screens: 0       # scroll N screens to load lazy cards
  rebuy_cooldown_h: 24    # don't buy the same product twice within this window

buyer:
  dry_run: true           # (dashboard) stop right before paying
  headless: false         # true = invisible browser (you can't take over a stuck checkout)
  profile_dir: browser_profile
  browser_channel: chrome # "chrome" = your installed Google Chrome; empty = Playwright Chromium
  verify_coins_on_product_page: false  # re-check the coin offer after opening the product
  max_order_amount: 2000  # (dashboard) read from the "Pay ₹X" button before clicking
  max_orders_per_day: 5   # (dashboard)
  max_spend_per_day: 5000 # (dashboard)
  max_parallel: 2
  debug_screenshots: true
  step_timeout_ms: 8000

payment:
  method: card            # (dashboard) card | cod | upi_wait
  card_last4: "1234"      # which saved card to use; CVV goes in .env
  use_new_card: false
  otp_timeout_s: 120

otp_webhook:
  enabled: false
  host: 0.0.0.0
  port: 8765

dashboard:
  host: 127.0.0.1         # keep local; anyone who can open the dashboard can trigger purchases
  port: 8080

notify:
  beep: true
